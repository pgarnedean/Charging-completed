<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>充電ランプディテクター</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f8f9fa; }
        /* キャンバス（映像が出る場所）を黒くして、ロードされたか分かりやすくします */
        canvas { border: 2px solid #333; max-width: 100%; height: auto; margin-top: 10px; background-color: #000; border-radius: 8px; }
        #status { font-weight: bold; color: #d35400; font-size: 1.1em; margin: 15px 0; line-height: 1.5; }
        button { padding: 15px 30px; font-size: 1.2em; cursor: pointer; border-radius: 8px; background-color: #3498db; color: white; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-weight: bold; }
        button:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>
    <h2>充電ランプ検知ツール</h2>
    
    <p id="status">システムを読み込み中...<br>（画面を開いたままお待ちください）</p>
    <button id="startBtn" disabled>カメラを起動する</button>

    <audio id="alertSound" src="sound.mp3" preload="auto"></audio>

    <div>
        <video id="video" autoplay playsinline muted style="display:none;"></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        // 状態管理
        let streaming = false;
        let yellowWasDetected = false;
        let audioPlayed = false;
        let src, dst, hsv, maskYellow, maskGreen, cap;

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const alertSound = document.getElementById('alertSound');

        // 【超安定版】OpenCVのロード監視
        // 単に読み込まれたかだけでなく、実際に動くかテストしてからボタンを有効化します
        let cvCheckInterval = setInterval(() => {
            try {
                if (typeof cv !== 'undefined' && typeof cv.Mat !== 'undefined') {
                    // テスト用データを作ってみて、エラーが出なければWASM（裏側）の起動完了
                    let testMat = new cv.Mat();
                    testMat.delete(); 

                    clearInterval(cvCheckInterval);
                    statusText.innerHTML = "準備完了！<br>「カメラを起動する」を押してください。";
                    statusText.style.color = "blue";
                    startBtn.disabled = false;
                }
            } catch (e) {
                // iPhoneでよくある「まだ準備中」のエラーなので無視して待ちます
            }
        }, 500);

        // カメラ起動ボタンを押した時の処理
        startBtn.addEventListener('click', async () => {
            // iOSの音声ブロックを解除するための無音再生
            try {
                alertSound.play().catch(()=>{});
                alertSound.pause();
                alertSound.currentTime = 0;
            } catch(e) {}

            if (!streaming) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment' },
                        audio: false
                    });
                    video.srcObject = stream;
                    video.play();
                } catch (err) {
                    alert("カメラの起動に失敗しました。\niPhoneの「設定」>「Safari」>「カメラ」が「許可」になっているか確認してください。\nエラー内容: " + err.message);
                }
            }
        });

        // ビデオの読み込みが完了したら画像処理をスタート
        video.addEventListener('canplay', function() {
            if (!streaming) {
                const width = video.videoWidth;
                const height = video.videoHeight;

                // iPhoneの縦横比に合わせてキャンバスを設定
                video.setAttribute('width', width);
                video.setAttribute('height', height);
                canvas.width = width;
                canvas.height = height;

                streaming = true;
                startBtn.style.display = "none";
                statusText.innerHTML = "カメラ起動中。<br>黄色のランプを枠内に映してください。";

                // メモリの確保
                src = new cv.Mat(height, width, cv.CV_8UC4);
                dst = new cv.Mat(height, width, cv.CV_8UC4);
                hsv = new cv.Mat(height, width, cv.CV_8UC3);
                maskYellow = new cv.Mat(height, width, cv.CV_8UC1);
                maskGreen = new cv.Mat(height, width, cv.CV_8UC1);
                cap = new cv.VideoCapture(video);

                requestAnimationFrame(processVideo);
            }
        }, false);

        function processVideo() {
            if (!streaming) return;

            try {
                cap.read(src);
                src.copyTo(dst);

                // RGBからHSV（色相・彩度・明度）に変換
                cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
                cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

                // 1. 黄色（CHARGE）の検出
                let lowYellow = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [15, 100, 100, 0]);
                let highYellow = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [35, 255, 255, 0]);
                cv.inRange(hsv, lowYellow, highYellow, maskYellow);

                // 2. 緑色（FULL）の検出
                let lowGreen = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [35, 100, 100, 0]);
                let highGreen = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [85, 255, 255, 0]);
                cv.inRange(hsv, lowGreen, highGreen, maskGreen);

                // 黄色の輪郭を取得
                let contoursYellow = new cv.MatVector();
                let hierarchyYellow = new cv.Mat();
                cv.findContours(maskYellow, contoursYellow, hierarchyYellow, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let isYellowNow = false;

                for (let i = 0; i < contoursYellow.size(); ++i) {
                    let cnt = contoursYellow.get(i);
                    if (cv.contourArea(cnt) > 30) {
                        isYellowNow = true;
                        yellowWasDetected = true;
                        let rect = cv.boundingRect(cnt);
                        let point1 = new cv.Point(rect.x, rect.y);
                        let point2 = new cv.Point(rect.x + rect.width, rect.y + rect.height);
                        // 白枠を描画
                        cv.rectangle(dst, point1, point2, [255, 255, 255, 255], 3);
                    }
                    cnt.delete();
                }

                // 緑色の輪郭を取得
                let contoursGreen = new cv.MatVector();
                let hierarchyGreen = new cv.Mat();
                cv.findContours(maskGreen, contoursGreen, hierarchyGreen, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let isGreenNow = false;
                for (let i = 0; i < contoursGreen.size(); ++i) {
                    let cnt = contoursGreen.get(i);
                    if (cv.contourArea(cnt) > 30) {
                        isGreenNow = true;
                    }
                    cnt.delete();
                }

                // メモリ解放（※必須）
                contoursYellow.delete(); hierarchyYellow.delete();
                contoursGreen.delete(); hierarchyGreen.delete();
                lowYellow.delete(); highYellow.delete();
                lowGreen.delete(); highGreen.delete();

                // 状態の表示と音声再生
                if (isYellowNow) {
                    statusText.innerHTML = "充電中（黄色のランプを検出中）...";
                    statusText.style.color = "#d35400";
                } else if (yellowWasDetected && isGreenNow && !audioPlayed) {
                    statusText.innerHTML = "充電完了！音声を再生しました。";
                    statusText.style.color = "green";
                    alertSound.play();
                    audioPlayed = true;
                } else if (yellowWasDetected && !isYellowNow && !isGreenNow && !audioPlayed) {
                    statusText.innerHTML = "黄色のランプが消えました。<br>緑の点灯を待機中...";
                    statusText.style.color = "gray";
                }

                cv.imshow('canvas', dst);
            } catch (err) {
                // エラー時は何もしない（画面フリーズを防ぐ）
            }

            requestAnimationFrame(processVideo);
        }
    </script>
    
    <script async src="https://docs.opencv.org/4.8.0/opencv.js"></script>
</body>
</html>
